name: Tests

on:
  push:
    branches: ['*.x']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-tests.yml@830e5953c0a1244b4e7a772b6e728492bdd8ef9f
    with:
      matrix-json: >-
        {"include":[
          {"php":"8.3","laravel":"13.*","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"lowest","expected_filament":"5.8.3"},
          {"php":"8.3","laravel":"13.*","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"latest"},
          {"php":"8.4","laravel":"13.*","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"lowest","expected_filament":"5.8.3"},
          {"php":"8.4","laravel":"13.*","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"latest"},
          {"php":"8.5","laravel":"13.*","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"lowest","expected_filament":"5.8.3"},
          {"php":"8.5","laravel":"13.*","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"latest"}
        ]}
      test-command: composer check

  browser:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-browser-tests.yml@830e5953c0a1244b4e7a772b6e728492bdd8ef9f
    with:
      filament-matrix-json: >-
        {"include":[{"filament":"^5.8.3"}]}
      php-version: '8.4'

  skills:
    name: Package standard skill distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify developing-filament-packages distribution
        shell: bash
        run: |
          test -f vendor/mortalkiller/filament-package-standard/resources/boost/skills/developing-filament-packages/SKILL.md
          grep -F 'name: developing-filament-packages' vendor/mortalkiller/filament-package-standard/resources/boost/skills/developing-filament-packages/SKILL.md
