name: Tests

on:
  push:
    branches: ['main', '1.x', 'feature/**', 'codex/**', 'release/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['lowest', 'latest']

    name: PHP ${{ matrix.php }} / Filament 5 ${{ matrix.dependencies }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer package
        run: composer validate --strict

      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Install latest supported dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Verify Filament version
        shell: bash
        env:
          DEPENDENCY_SET: ${{ matrix.dependencies }}
        run: |
          set -euo pipefail
          composer show filament/filament
          version="$(composer show filament/filament --format=json | php -r '$data = json_decode(stream_get_contents(STDIN), true); $version = $data["versions"][0] ?? ""; echo preg_replace("/^[* ]*v?/", "", $version);')"

          case "$version" in
            5.*) ;;
            *)
              echo "Expected Filament 5.x, resolved [$version]." >&2
              exit 1
              ;;
          esac

          if [ "$DEPENDENCY_SET" = "lowest" ] && [ "$version" != "5.7.6" ]; then
            echo "Expected the lowest supported Filament version [5.7.6], resolved [$version]." >&2
            exit 1
          fi

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpstan analyse --memory-limit=1G 2>&1 | tee phpstan-${{ matrix.php }}-${{ matrix.dependencies }}.log

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Upload static analysis log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phpstan-${{ matrix.php }}-${{ matrix.dependencies }}
          path: phpstan-${{ matrix.php }}-${{ matrix.dependencies }}.log
          retention-days: 7
