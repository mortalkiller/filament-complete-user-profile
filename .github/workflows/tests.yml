name: Tests

on:
  push:
    branches: ['*.x']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-tests.yml@fd1b3f6ef3fd383de952c8a4f210c51b49f63e36
    with:
      matrix-json: >-
        {"include":[
          {"php":"8.3","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"lowest","expected_filament":"5.8.3"},
          {"php":"8.3","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"latest"},
          {"php":"8.4","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"lowest","expected_filament":"5.8.3"},
          {"php":"8.4","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"latest"},
          {"php":"8.5","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"lowest","expected_filament":"5.8.3"},
          {"php":"8.5","testbench":"^11.2","filament":">=5.8.3 <6.0.0","dependencies":"latest"}
        ]}
      test-command: composer check
