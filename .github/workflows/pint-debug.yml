name: Pint Debug

on:
  push:
    branches: ['1.x']
    paths:
      - '.github/workflows/pint-debug.yml'

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Format target
        run: ./vendor/bin/pint tests/Feature/TenantScopedTokensTest.php

      - name: Show formatted diff
        run: git diff --no-ext-diff --unified=20 -- tests/Feature/TenantScopedTokensTest.php
