name: Code quality

on:
  push:
    branches: ['*.x']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@6ceb549dd431ccbec57e1fcf67321df2b40b0a92
    with:
      php-version: '8.4'
      static-analysis: true

  distribution:
    name: Distribution archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify distribution archive
        shell: bash
        run: |
          set -euo pipefail
          archive_contents="$(git archive HEAD | tar -tf -)"

          required_paths=(
            'composer.json'
            'src/'
            'config/'
            'database/'
            'resources/'
          )

          for path in "${required_paths[@]}"; do
            if ! grep -Fq "$path" <<< "$archive_contents"; then
              echo "Required distribution path is missing: $path" >&2
              exit 1
            fi
          done

          forbidden_paths=(
            '.github/'
            '.gitignore'
            'tests/'
            'docs/superpowers/'
            'docs/verification.md'
            '.editorconfig'
            'phpunit.xml.dist'
            'phpstan.neon.dist'
            'pint.json'
            'CONTRIBUTING.md'
            'docs-site/'
            'composer.lock'
          )

          for path in "${forbidden_paths[@]}"; do
            if grep -Fq "$path" <<< "$archive_contents"; then
              echo "Development-only path leaked into distribution archive: $path" >&2
              exit 1
            fi
          done
