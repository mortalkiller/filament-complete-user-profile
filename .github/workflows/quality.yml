name: Code quality

on:
  push:
    branches: ['main', '1.x', 'feature/**', 'codex/**', 'release/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer package
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

      - name: Check code style
        run: composer lint

      - name: Run static analysis
        run: composer analyse

      - name: Check tracked PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n 1 php -l

      - name: Verify distribution archive
        shell: bash
        run: |
          set -euo pipefail

          archive_contents="$(git archive HEAD | tar -tf -)"

          required_paths=(
            'composer.json'
            'src/'
            'config/'
            'database/'
            'resources/'
          )

          for path in "${required_paths[@]}"; do
            if ! grep -Fq "$path" <<< "$archive_contents"; then
              echo "Required distribution path is missing: $path" >&2
              exit 1
            fi
          done

          forbidden_paths=(
            '.github/'
            '.gitignore'
            'tests/'
            'docs/superpowers/'
            'docs/verification.md'
            'phpunit.xml.dist'
            'phpstan.neon.dist'
            'pint.json'
            'CONTRIBUTING.md'
            'docs-site/'
            'composer.lock'
          )

          for path in "${forbidden_paths[@]}"; do
            if grep -Fq "$path" <<< "$archive_contents"; then
              echo "Development-only path leaked into distribution archive: $path" >&2
              exit 1
            fi
          done
