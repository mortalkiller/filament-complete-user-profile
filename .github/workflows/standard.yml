name: Package standard

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-standard-check.yml@fd1b3f6ef3fd383de952c8a4f210c51b49f63e36
    with:
      standard-ref: fd1b3f6ef3fd383de952c8a4f210c51b49f63e36
