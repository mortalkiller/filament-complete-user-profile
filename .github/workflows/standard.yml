name: Package standard

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-standard-check.yml@1cdc0e62d021fbef5ded991aced9e5a7e29e3277
    with:
      standard-ref: 830e5953c0a1244b4e7a772b6e728492bdd8ef9f
