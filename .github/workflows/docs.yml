name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@5ed6a6b06b4d8e7c2b2d013eedbe86aeba01d5af
    with:
      artifact-name: filament-complete-user-profile-docs
      deploy: false
