name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@6ceb549dd431ccbec57e1fcf67321df2b40b0a92
    with:
      artifact-name: filament-complete-user-profile-docs
      deploy: false
