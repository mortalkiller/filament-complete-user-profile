name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@fd1b3f6ef3fd383de952c8a4f210c51b49f63e36
    with:
      artifact-name: filament-complete-user-profile-docs
      deploy: false
