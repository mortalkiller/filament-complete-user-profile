name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@6fa3047f0fcb02c9b6f296d95944ffd473a8901c
    with:
      artifact-name: filament-complete-user-profile-docs
      deploy: false
