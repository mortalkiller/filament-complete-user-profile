name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@15e1007e3953994d67b55cc351ca6eafe1c31f0b
    with:
      artifact-name: filament-complete-user-profile-docs
      node-version: '22.23.4'
      deploy: false
