name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@03e45bebb4be1b76b6fa25c77a9e6f8a2c86c84f
    with:
      artifact-name: filament-complete-user-profile-docs
      node-version: '22.23.4'
      deploy: false
