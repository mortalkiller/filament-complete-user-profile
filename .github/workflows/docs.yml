name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@c2d3c5d978aa12a9ba60219eccb8fdbbbc0279b0
    with:
      artifact-name: filament-complete-user-profile-docs
      deploy: false
