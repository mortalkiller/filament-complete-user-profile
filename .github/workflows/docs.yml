name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@1cdc0e62d021fbef5ded991aced9e5a7e29e3277
    with:
      artifact-name: filament-complete-user-profile-docs
      node-version: '22.23.4'
      deploy: false
