name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@50aa14ee7a84caf7a0065a5937d5fd98c5298600
    with:
      artifact-name: filament-complete-user-profile-docs
      node-version: '22.23.4'
      deploy: false
