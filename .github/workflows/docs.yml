name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@b4f20c70029506087bdf4a8eb5258e0950b5a88f
    with:
      artifact-name: filament-complete-user-profile-docs
      deploy: false
