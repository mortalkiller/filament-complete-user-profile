name: Capture README screenshots

on:
  push:
    branches: ['1.x']
    paths:
      - '.github/workflows/capture-readme-screenshots.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare workbench
        run: composer browser:prepare

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.20.0'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: npm run test:browser -- tests/Browser/profile-showcase.spec.mjs

      - name: Publish README screenshots
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/screenshots

          light_desktop="$(find test-results -type f -name 'profile-light-1440.png' -print -quit)"
          dark_desktop="$(find test-results -type f -name 'profile-dark-1440.png' -print -quit)"
          light_mobile="$(find test-results -type f -name 'profile-light-390.png' -print -quit)"
          dark_mobile="$(find test-results -type f -name 'profile-dark-390.png' -print -quit)"

          test -n "$light_desktop"
          test -n "$dark_desktop"
          test -n "$light_mobile"
          test -n "$dark_mobile"

          cp "$light_desktop" docs/screenshots/desktop-light.png
          cp "$dark_desktop" docs/screenshots/desktop-dark.png
          cp "$light_mobile" docs/screenshots/mobile-light.png
          cp "$dark_mobile" docs/screenshots/mobile-dark.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots

          if git diff --cached --quiet; then
            echo "README screenshots are already current."
            exit 0
          fi

          git commit -m "Add README screenshots"
          git push origin HEAD:1.x
