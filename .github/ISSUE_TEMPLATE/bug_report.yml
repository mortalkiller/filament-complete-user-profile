name: Bug report
description: Report reproducible incorrect package behavior.
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Do not include credentials, customer data, private application names, internal URLs, or infrastructure details.
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: v1.2.3
    validations:
      required: true
  - type: input
    id: filament-version
    attributes:
      label: Filament version
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest public-safe code/configuration needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, secrets, private URLs, customer data, and personal information before posting.
